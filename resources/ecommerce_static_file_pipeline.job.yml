resources:
  jobs:
    ecommerce_static_file_pipeline:
      name: ecommerce_static_file_pipeline
      tasks:
        - task_key: bronze_olist_customers
          notebook_task:
            notebook_path: ../notebooks/operational/bronze/olist/customers_bronze.ipynb
            source: WORKSPACE
        - task_key: bronze_olist_geolocation
          notebook_task:
            notebook_path: ../notebooks/operational/bronze/olist/geolocation_bronze.ipynb
            source: WORKSPACE
        - task_key: bronze_olist_marketing_closed_deals
          notebook_task:
            notebook_path: ../notebooks/operational/bronze/olist_marketing/closed_deals_bronze.ipynb
            source: WORKSPACE
        - task_key: bronze_olist_marketing_qualified_leads
          notebook_task:
            notebook_path: ../notebooks/operational/bronze/olist_marketing/marketing_qualified_leads_bronze.ipynb
            source: WORKSPACE
        - task_key: bronze_olist_order_items
          notebook_task:
            notebook_path: ../notebooks/operational/bronze/olist/order_items_bronze.ipynb
            source: WORKSPACE
        - task_key: bronze_olist_order_payments
          notebook_task:
            notebook_path: ../notebooks/operational/bronze/olist/order_payments_bronze.ipynb
            source: WORKSPACE
        - task_key: bronze_olist_order_reviews
          notebook_task:
            notebook_path: ../notebooks/operational/bronze/olist/order_reviews_bronze.ipynb
            source: WORKSPACE
        - task_key: bronze_olist_orders
          notebook_task:
            notebook_path: ../notebooks/operational/bronze/olist/orders_bronze.ipynb
            source: WORKSPACE
        - task_key: bronze_olist_product_category_translation
          notebook_task:
            notebook_path: ../notebooks/operational/bronze/olist/product_category_translation_bronze.ipynb
            source: WORKSPACE
        - task_key: bronze_olist_products
          notebook_task:
            notebook_path: ../notebooks/operational/bronze/olist/products_bronze.ipynb
            source: WORKSPACE
        - task_key: bronze_olist_sellers
          notebook_task:
            notebook_path: ../notebooks/operational/bronze/olist/sellers_bronze.ipynb
            source: WORKSPACE
        - task_key: bronze_retailrocket_category_tree
          notebook_task:
            notebook_path: ../notebooks/operational/bronze/retailrocket/category_tree_bronze.ipynb
            source: WORKSPACE
        - task_key: bronze_retailrocket_events
          notebook_task:
            notebook_path: ../notebooks/operational/bronze/retailrocket/events_bronze.ipynb
            source: WORKSPACE
        - task_key: silver_olist_customers
          depends_on:
            - task_key: bronze_olist_customers
          notebook_task:
            notebook_path: ../notebooks/operational/silver/olist/customers_silver.ipynb
            source: WORKSPACE
        - task_key: silver_olist_geolocation
          depends_on:
            - task_key: bronze_olist_geolocation
          notebook_task:
            notebook_path: ../notebooks/operational/silver/olist/geolocation_silver.ipynb
            source: WORKSPACE
        - task_key: silver_olist_marketing_closed_deals
          depends_on:
            - task_key: bronze_olist_marketing_closed_deals
          notebook_task:
            notebook_path: ../notebooks/operational/silver/olist_marketing/closed_deals_silver.ipynb
            source: WORKSPACE
        - task_key: silver_olist_marketing_qualified_leads
          depends_on:
            - task_key: bronze_olist_marketing_qualified_leads
          notebook_task:
            notebook_path: ../notebooks/operational/silver/olist_marketing/marketing_qualified_leads_silver.ipynb
            source: WORKSPACE
        - task_key: silver_olist_order_items
          depends_on:
            - task_key: bronze_olist_order_items
          notebook_task:
            notebook_path: ../notebooks/operational/silver/olist/order_items_silver.ipynb
            source: WORKSPACE
        - task_key: silver_olist_order_payments
          depends_on:
            - task_key: bronze_olist_order_payments
          notebook_task:
            notebook_path: ../notebooks/operational/silver/olist/order_payments_silver.ipynb
            source: WORKSPACE
        - task_key: silver_olist_order_reviews
          depends_on:
            - task_key: bronze_olist_order_reviews
          notebook_task:
            notebook_path: ../notebooks/operational/silver/olist/order_reviews_silver.ipynb
            source: WORKSPACE
        - task_key: silver_olist_orders
          depends_on:
            - task_key: bronze_olist_orders
          notebook_task:
            notebook_path: ../notebooks/operational/silver/olist/orders_silver.ipynb
            source: WORKSPACE
        - task_key: silver_olist_product_category_translation
          depends_on:
            - task_key: bronze_olist_product_category_translation
          notebook_task:
            notebook_path: ../notebooks/operational/silver/olist/product_category_translation_silver.ipynb
            source: WORKSPACE
        - task_key: silver_olist_products
          depends_on:
            - task_key: bronze_olist_products
            - task_key: silver_olist_product_category_translation
          notebook_task:
            notebook_path: ../notebooks/operational/silver/olist/products_silver.ipynb
            source: WORKSPACE
        - task_key: silver_olist_sellers
          depends_on:
            - task_key: bronze_olist_sellers
          notebook_task:
            notebook_path: ../notebooks/operational/silver/olist/sellers_silver.ipynb
            source: WORKSPACE
        - task_key: silver_retailrocket_category_tree
          depends_on:
            - task_key: bronze_retailrocket_category_tree
          notebook_task:
            notebook_path: ../notebooks/operational/silver/retailrocket/category_tree_silver.ipynb
            source: WORKSPACE
        - task_key: silver_retailrocket_events
          depends_on:
            - task_key: bronze_retailrocket_events
          notebook_task:
            notebook_path: ../notebooks/operational/silver/retailrocket/events_silver.ipynb
            source: WORKSPACE
        - task_key: generate_retailrocket_olist_bridges
          depends_on:
            - task_key: silver_retailrocket_events
            - task_key: silver_olist_products
            - task_key: silver_olist_customers
          spark_python_task:
            python_file: ../scripts/generation/generate_retailrocket_olist_bridges.py
            parameters:
              - "{{job.parameters.environment}}"
          environment_key: Default
      parameters:
        - name: environment
          default: dev
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      max_concurrent_runs: 1
      queue:
        enabled: false
      performance_target: PERFORMANCE_OPTIMIZED
