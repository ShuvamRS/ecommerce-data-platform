resources:
  jobs:
    silver_static:
      name: silver_static
      tasks:
      - task_key: silver_olist_customers
        notebook_task:
          notebook_path: ../notebooks/operational/silver/olist/customers_silver.ipynb
          source: WORKSPACE
      - task_key: silver_olist_geolocation
        notebook_task:
          notebook_path: ../notebooks/operational/silver/olist/geolocation_silver.ipynb
          source: WORKSPACE
      - task_key: silver_olist_marketing_closed_deals
        notebook_task:
          notebook_path: ../notebooks/operational/silver/olist_marketing/closed_deals_silver.ipynb
          source: WORKSPACE
      - task_key: silver_olist_marketing_qualified_leads
        notebook_task:
          notebook_path: ../notebooks/operational/silver/olist_marketing/marketing_qualified_leads_silver.ipynb
          source: WORKSPACE
      - task_key: silver_olist_order_items
        notebook_task:
          notebook_path: ../notebooks/operational/silver/olist/order_items_silver.ipynb
          source: WORKSPACE
      - task_key: silver_olist_order_payments
        notebook_task:
          notebook_path: ../notebooks/operational/silver/olist/order_payments_silver.ipynb
          source: WORKSPACE
      - task_key: silver_olist_order_reviews
        notebook_task:
          notebook_path: ../notebooks/operational/silver/olist/order_reviews_silver.ipynb
          source: WORKSPACE
      - task_key: silver_olist_orders
        notebook_task:
          notebook_path: ../notebooks/operational/silver/olist/orders_silver.ipynb
          source: WORKSPACE
      - task_key: silver_olist_product_category_translation
        notebook_task:
          notebook_path: ../notebooks/operational/silver/olist/product_category_translation_silver.ipynb
          source: WORKSPACE
      - task_key: silver_olist_products
        depends_on:
        - task_key: silver_olist_product_category_translation
        notebook_task:
          notebook_path: ../notebooks/operational/silver/olist/products_silver.ipynb
          source: WORKSPACE
      - task_key: silver_olist_sellers
        notebook_task:
          notebook_path: ../notebooks/operational/silver/olist/sellers_silver.ipynb
          source: WORKSPACE
      - task_key: silver_retailrocket_events
        notebook_task:
          notebook_path: ../notebooks/operational/silver/retailrocket/events_silver.ipynb
          source: WORKSPACE
      - task_key: generate_retailrocket_olist_item_bridge
        depends_on:
        - task_key: silver_retailrocket_events
        - task_key: silver_olist_products
        spark_python_task:
          python_file: ../scripts/generate_retailrocket_olist_item_bridge.py
          parameters:
          - '{{job.parameters.environment}}'
        environment_key: Default
      parameters:
      - name: environment
        default: ${bundle.target}
      environments:
      - environment_key: Default
        spec:
          environment_version: '5'
      max_concurrent_runs: 1
      queue:
        enabled: false
      performance_target: PERFORMANCE_OPTIMIZED
