bundle:
  name: unified_ecommerce_data_platform

include:
  - resources/*.yml

variables:
  dbt_warehouse_id:
    description: SQL warehouse used by the dbt Gold task.
    lookup:
      warehouse: "Serverless Starter Warehouse"

targets:
  dev:
    default: true
    mode: development

  test:
    run_as:
      service_principal_name: d82a2f35-da74-4f48-bec0-767466060d57

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: d82a2f35-da74-4f48-bec0-767466060d57
