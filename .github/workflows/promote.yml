name: Promote

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to promote to
        required: true
        type: choice
        options:
          - test
          - prod

      commit_sha:
        description: Approved release commit SHA
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  promote:
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}

    steps:
      - name: Checkout approved release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@v1.12.1

      - name: Validate Databricks bundle
        run: databricks bundle validate -t "${{ inputs.target }}"

      - name: Deploy Databricks bundle
        run: databricks bundle deploy -t "${{ inputs.target }}"

      - name: Run test integration workflow
        if: ${{ inputs.target == 'test' }}
        run: databricks bundle run -t test ecommerce_platform
